name: Deploy API to Cloudflare Workers

# Bật bằng biến repo API_DEPLOY_ENABLED=true sau khi đã tạo D1 và điền database_id trong apps/api/wrangler.jsonc.
# Cần secret CLOUDFLARE_API_TOKEN (quyền Workers + D1) và CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "bun.lock"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.API_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter=@abugikha/api test
      # Migration trước, deploy sau: migration luôn phải tương thích ngược với code đang chạy
      - run: bun run db:migrate:remote
        working-directory: apps/api
      - run: bun run deploy
        working-directory: apps/api
